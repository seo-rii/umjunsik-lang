name: Go interpreter

on:
  pull_request:
    paths:
      - 'umjunsik-lang-go/**'
      - '.github/workflows/go.yml'
  push:
    branches: [master]
    paths:
      - 'umjunsik-lang-go/**'
      - '.github/workflows/go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', 'stable']
    defaults:
      run:
        working-directory: umjunsik-lang-go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false # This module only uses the standard library; no go.sum.
      - name: Unit and CLI regressions
        run: go test -count=1 -timeout=120s ./...
      - name: Static checks
        run: go vet ./...
      - name: Race-instrumented interpreter and tests
        if: matrix.go == 'stable'
        env:
          GORACE: atexit_sleep_ms=0
        run: |
          go build -race -o "${RUNNER_TEMP}/umjunsik-lang-go-race" .
          UHMLANG_BINARY="${RUNNER_TEMP}/umjunsik-lang-go-race" \
            go test -race -count=1 -timeout=120s ./...
